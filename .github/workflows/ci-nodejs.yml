name: CI (nodejs)

on:
  push:
    paths:
      - "home/isucon/webapp/nodejs/**"
      - ".github/workflows/ci-nodejs.yml"
  pull_request:
    paths:
      - "home/isucon/webapp/nodejs/**"
      - ".github/workflows/ci-nodejs.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: home/isucon/webapp/nodejs

jobs:
  typecheck-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: home/isucon/webapp/nodejs/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint (biome)
        run: npx biome check .
