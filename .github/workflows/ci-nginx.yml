name: CI (nginx config syntax check)

# 注意: SSL秘密鍵は意図的にこのリポジトリから除外している(.gitignore参照)。
# nginx -t は証明書ファイルの実在チェックも行うため、CI実行時のみダミーの
# 秘密鍵を生成して満たす。実際のサーバーには一切影響しない(このジョブは
# GitHub Actionsのランナー上でのみ完結し、自動デプロイは行わない)。

on:
  push:
    paths:
      - "etc/nginx/**"
      - ".github/workflows/ci-nginx.yml"
  pull_request:
    paths:
      - "etc/nginx/**"
      - ".github/workflows/ci-nginx.yml"
  workflow_dispatch:

jobs:
  nginx-syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nginx
        run: sudo apt-get update && sudo apt-get install -y nginx

      - name: Overlay checked-out nginx config onto /etc/nginx
        run: sudo rsync -a --delete etc/nginx/ /etc/nginx/

      - name: Generate dummy TLS key+cert pairs (CIのみ、実際の秘密鍵・証明書は使わない)
        # nginx -t は秘密鍵と証明書の鍵ペア一致まで検証するため、リポジトリ内の
        # 既存.crtをそのまま使うと鍵不一致でエラーになる。ペアで生成・上書きする。
        run: |
          sudo mkdir -p /etc/nginx/tls /etc/ssl/private /etc/ssl/certs
          declare -A pairs=(
            ["/etc/nginx/tls/dummy.key"]="/etc/nginx/tls/dummy.crt"
            ["/etc/nginx/tls/_.xiv.isucon.net.key"]="/etc/nginx/tls/_.xiv.isucon.net.crt"
            ["/etc/ssl/private/ssl-cert-snakeoil.key"]="/etc/ssl/certs/ssl-cert-snakeoil.pem"
          )
          for key in "${!pairs[@]}"; do
            cert="${pairs[$key]}"
            sudo openssl req -x509 -newkey rsa:2048 -keyout "$key" -out "$cert" \
              -days 1 -nodes -subj "/CN=ci-dummy" >/dev/null 2>&1
          done

      - name: nginx -t
        run: sudo nginx -t
