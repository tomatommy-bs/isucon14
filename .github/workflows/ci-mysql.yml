name: CI (mysql config validation)

on:
  push:
    paths:
      - "mysql/**"
      - ".github/workflows/ci-mysql.yml"
  pull_request:
    paths:
      - "mysql/**"
      - ".github/workflows/ci-mysql.yml"
  workflow_dispatch:

jobs:
  mysql-config-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mysql-server
        run: sudo apt-get update && sudo apt-get install -y mysql-server

      - name: Overlay checked-out mysql config onto /etc/mysql
        run: sudo rsync -a --delete mysql/ /etc/mysql/

      - name: Validate mysqld config syntax
        run: sudo mysqld --validate-config
